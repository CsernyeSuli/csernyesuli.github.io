<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6. Osztály - Csoportválasztó</title>
    <link rel="stylesheet" href="osztalylap_style.css">
    <style>
        .csoport-kontener {
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .gomb-doboz {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .csoport-gomb {
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
        }
        .alap-gomb {
            background-color: #0066cc;
        }
        .alap-gomb:hover {
            background-color: #004c99;
            transform: translateY(-2px);
        }
        .halado-gomb {
            background-color: #28a745;
        }
        .halado-gomb:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        .vissza-link {
            display: inline-block;
            margin-top: 40px;
            color: #666;
            text-decoration: none;
        }
        .vissza-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="csoport-kontener">
        <h1>6. Osztályos Tananyagok</h1>
        <p>Kérlek, válaszd ki a hozzád tartozó csoportot:</p>
        
        <div class="gomb-doboz">
            <a href="6-osztaly-alap.html" class="csoport-gomb alap-gomb">Alap Csoport</a>
            <a href="6-osztaly-halado.html" class="csoport-gomb halado-gomb">Haladó Csoport</a>
        </div>

        <p><a href="index.html" class="vissza-link">&larr; Vissza a főoldalra</a></p>
    </div>

</body>
</html>
