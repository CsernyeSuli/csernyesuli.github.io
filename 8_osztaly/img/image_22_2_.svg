<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" style="background-color: #0b0f19; width: 100%; height: auto; font-family: 'Segoe UI', sans-serif;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .line { stroke: #94a3b8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .arc { fill: none; stroke: #38bdf8; stroke-width: 3.5; }
    .text-main { fill: #f8fafc; font-size: 28px; font-weight: bold; font-family: serif; font-style: italic; }
    .text-blue { fill: #38bdf8; font-size: 26px; font-weight: bold; }
    .text-frac { fill: #38bdf8; font-size: 22px; font-weight: bold; }
    .point-label { fill: #f8fafc; font-size: 28px; font-weight: bold; font-family: sans-serif; font-style: italic; }
  </style>

  <!-- Háromszög és belső szakaszok vonalai (pontos szögekkel: α = 44°, β = 34°, γ = 102°) -->
  <!-- AB alapvonal -->
  <line x1="60.0" y1="420.0" x2="940.0" y2="420.0" class="line" />
  <!-- AC oldal -->
  <line x1="60.0" y1="420.0" x2="421.9" y2="70.5" class="line" />
  <!-- BC oldal -->
  <line x1="940.0" y1="420.0" x2="421.9" y2="70.5" class="line" />
  <!-- CQ szakasz (e) -->
  <line x1="421.9" y1="70.5" x2="347.6" y2="420.0" class="line" />
  <!-- CP szakasz (f) -->
  <line x1="421.9" y1="70.5" x2="563.1" y2="420.0" class="line" />

  <!-- ÍVEK (Szögek megjelölése) -->
  <!-- alpha szög ív A-nál -->
  <path d="M 122.0 420.0 A 62 62 0 0 0 104.6 376.9" class="arc" />

  <!-- beta szög ív B-nél -->
  <path d="M 878.0 420.0 A 62 62 0 0 1 888.6 385.3" class="arc" />

  <!-- 102° és delta szögek íve Q-nál -->
  <path d="M 427.6 420.0 A 80 80 0 0 0 267.6 420.0" class="arc" />

  <!-- C csúcsnál lévő három egyenlő gamma/3 szög íve -->
  <path d="M 332.0 157.4 A 125 125 0 0 0 525.5 140.4" class="arc" stroke-width="4.5" />

  <!-- SZÖVEGEK ÉS JELÖLÉSEK -->
  <!-- Csúcsok betűjelei -->
  <text x="34.0" y="436.0" class="point-label">A</text>
  <text x="952.0" y="436.0" class="point-label">B</text>
  <text x="409.9" y="48.5" class="point-label">C</text>
  <text x="337.6" y="460.0" class="point-label">Q</text>
  <text x="555.1" y="460.0" class="point-label">P</text>

  <!-- Görög betűs szögek -->
  <text x="145.3" y="394.5" text-anchor="middle" class="text-main">α</text>
  <text x="852.0" y="402.1" text-anchor="middle" class="text-main">β</text>
  <text x="388.0" y="396.3" text-anchor="middle" class="text-main">δ</text>
  <text x="314.9" y="388.6" text-anchor="middle" class="text-blue">102°</text>

  <!-- Oldal/szakasz jelölések -->
  <text x="354.7" y="255.3" class="text-main">e</text>
  <text x="466.5" y="255.3" class="text-main">f</text>
  <text x="751.5" y="455.0" class="text-main">f</text>

  <!-- C csúcsnál lévő törtek (gamma / 3) -->
  <g transform="translate(368.1, 118.2)">
    <text x="9" y="20" class="text-frac">γ</text>
    <line x1="4" y1="27" x2="26" y2="27" stroke="#38bdf8" stroke-width="2" />
    <text x="9" y="46" class="text-frac">3</text>
  </g>
  <g transform="translate(415.0, 128.2)">
    <text x="9" y="20" class="text-frac">γ</text>
    <line x1="4" y1="27" x2="26" y2="27" stroke="#38bdf8" stroke-width="2" />
    <text x="9" y="46" class="text-frac">3</text>
  </g>
  <g transform="translate(459.5, 110.3)">
    <text x="9" y="20" class="text-frac">γ</text>
    <line x1="4" y1="27" x2="26" y2="27" stroke="#38bdf8" stroke-width="2" />
    <text x="9" y="46" class="text-frac">3</text>
  </g>
</svg>
