<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vonalhúzó Párbaj - 3 Élet</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #f0f4f8; color: #1a202c; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
  
  /* Beállítások panel */
  #beallitas-panel { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); max-width: 440px; width: 100%; margin-top: 20px; }
  .input-csoport { margin-bottom: 18px; text-align: left; }
  .input-csoport label { display: block; font-weight: bold; margin-bottom: 6px; }
  .input-csoport input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #cbd5e0; border-radius: 8px; transition: 0.2s; }
  .input-csoport input:focus { border-color: #3182ce; outline: none; box-shadow: 0 0 8px rgba(49, 130, 206, 0.3); }

  /* Animált gombok */
  .kezdo-valaszto { display: flex; gap: 12px; }
  .kezdo-gomb { flex: 1; padding: 13px 10px; font-size: 15px; font-weight: bold; border: 2px solid #cbd5e0; border-radius: 10px; background: #edf2f7; color: #718096; cursor: pointer; opacity: 0.75; transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1); }
  .kezdo-gomb:hover { opacity: 1; transform: translateY(-3px); box-shadow: 0 5px 12px rgba(0,0,0,0.12); border-color: #a0aec0; }
  
  .kivalasztva-1 { background: #3182ce !important; border-color: #2b6cb0 !important; color: white !important; opacity: 1 !important; transform: scale(1.05); box-shadow: 0 0 15px rgba(49, 130, 206, 0.5) !important; }
  .kivalasztva-2 { background: #e53e3e !important; border-color: #c53030 !important; color: white !important; opacity: 1 !important; transform: scale(1.05); box-shadow: 0 0 15px rgba(229, 62, 62, 0.5) !important; }
  .kivalasztva-1::before, .kivalasztva-2::before { content: "✔ "; }

  .start-gomb { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; background: #38a169; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 6px rgba(56, 161, 105, 0.3); transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1); }
  .start-gomb:hover { background: #2f855a; transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 18px rgba(56, 161, 105, 0.45); }

  /* Játéktér */
  #jatek-ter { display: none; width: 100%; max-width: 850px; flex-direction: column; align-items: center; }
  #szam { font-size: 130px; font-weight: bold; color: #2b6cb0; margin: 5px 0; line-height: 1.1; }
  #ido-doboz { font-size: 36px; font-weight: bold; color: #38a169; margin: 10px 0 20px 0; min-height: 45px; }
  .lejart { color: #e53e3e !important; }

  .parbaj-ter { display: flex; justify-content: center; gap: 30px; margin: 10px auto 25px auto; width: 100%; flex-wrap: wrap; }
  .jatekos-kartya { background: white; padding: 18px 25px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); width: 320px; border: 3px solid transparent; transition: all 0.3s ease; }
  .aktiv-kartya-1 { border-color: #3182ce; background-color: #ebf8ff; transform: scale(1.03); }
  .aktiv-kartya-2 { border-color: #e53e3e; background-color: #fff5f5; transform: scale(1.03); }
  .nyertes { border-color: #38a169 !important; background-color: #f0fff4 !important; transform: scale(1.05); }
  .vesztes { opacity: 0.55; background-color: #fed7d7 !important; }
  
  .jatekos-cim { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
  .szivek { font-size: 42px; margin: 10px 0; letter-spacing: 5px; }

  .elet-gomb { background-color: #e53e3e; font-size: 16px; font-weight: bold; padding: 10px 20px; border-radius: 8px; color: white; border: none; cursor: pointer; transition: all 0.2s ease; }
  .elet-gomb:hover:not(:disabled) { background-color: #c53030; transform: translateY(-2px) scale(1.03); box-shadow: 0 4px 10px rgba(229, 62, 62, 0.4); }
  .elet-gomb:disabled { background-color: #cbd5e0; cursor: not-allowed; }

  .gomb-sor { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
  .fo-gomb { font-size: 20px; font-weight: bold; padding: 15px 30px; cursor: pointer; color: white; border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1); }
  #gomb { background-color: #3182ce; }
  #gomb:hover:not(:disabled) { background-color: #2b6cb0; transform: translateY(-3px) scale(1.03); box-shadow: 0 8px 16px rgba(49, 130, 206, 0.4); }
  #gomb:disabled { background-color: #a0aec0; cursor: not-allowed; box-shadow: none; }
  #reset-gomb { background-color: #718096; font-size: 18px; }
  #reset-gomb:hover { background-color: #4a5568; transform: translateY(-3px); box-shadow: 0 6px 14px rgba(74, 85, 104, 0.35); }
  #hatralevo { margin-top: 20px; font-size: 17px; color: #4a5568; }
</style>
</head>
<body>

  <div style="width: 100%; max-width: 850px; text-align: left; margin-bottom: 10px;">
    <a href="jatekok.html" style="display: inline-block; background: #0284c7; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 15px;">⬅ Vissza a játékokhoz</a>
  </div>

  <div id="beallitas-panel">
    <h1 style="color: #2b6cb0; margin-top: 0;">📏 Vonalhúzó Párbaj</h1>
    <div class="input-csoport">
      <label style="color: #2b6cb0;">1. Játékos neve (Kék):</label>
      <input type="text" id="nev1-input" placeholder="1. Játékos">
    </div>
    <div class="input-csoport">
      <label style="color: #c53030;">2. Játékos neve (Piros):</label>
      <input type="text" id="nev2-input" placeholder="2. Játékos">
    </div>
    <div class="input-csoport">
      <label>Ki kezdje a játékot?</label>
      <div class="kezdo-valaszto">
        <button type="button" class="kezdo-gomb" id="valaszt-1" onclick="kezdo(1)">1. Játékos kezd</button>
        <button type="button" class="kezdo-gomb" id="valaszt-2" onclick="kezdo(2)">2. Játékos kezd</button>
      </div>
    </div>
    <button type="button" class="start-gomb" onclick="jatekInditasa()">Játék indítása ▶</button>
  </div>
  <div id="jatek-ter">
    <h1 style="margin-bottom: 5px;">Húzzatok ekkora vonalat:</h1>
    <div id="szam">?</div>
    <div id="ido-doboz">Készen álltok?</div>

    <div class="parbaj-ter">
      <div class="jatekos-kartya" id="kartya1">
        <div class="jatekos-cim" id="nev1-kijelzo" style="color: #2b6cb0;"></div>
        <div class="szivek" id="szivek1">❤️❤️❤️</div>
        <button type="button" class="elet-gomb" id="minusz1" onclick="eletVesztes(1)">💔 1 élet levonása</button>
      </div>

      <div class="jatekos-kartya" id="kartya2">
        <div class="jatekos-cim" id="nev2-kijelzo" style="color: #c53030;"></div>
        <div class="szivek" id="szivek2">❤️❤️❤️</div>
        <button type="button" class="elet-gomb" id="minusz2" onclick="eletVesztes(2)">💔 1 élet levonása</button>
      </div>
    </div>
    
    <div class="gomb-sor">
      <button type="button" class="fo-gomb" id="gomb" onclick="ujKor()">🎲 Következő szám és idő indítása</button>
      <button type="button" class="fo-gomb" id="reset-gomb" onclick="teljesUjrainditas()">🔄 Új párbaj</button>
    </div>
    
    <div id="hatralevo"></div>
  </div>

  <script>
    let elerhetoSzamok = [], idozito = null, jatekVege = false;
    let nev1 = "1. Játékos", nev2 = "2. Játékos", kezdoJatekos = null;
    let eletek = { 1: 3, 2: 3 };

    document.getElementById("nev1-input").oninput = e => document.getElementById("valaszt-1").innerText = (e.target.value.trim() || "1. Játékos") + " kezd";
    document.getElementById("nev2-input").oninput = e => document.getElementById("valaszt-2").innerText = (e.target.value.trim() || "2. Játékos") + " kezd";

    function kezdo(szam) {
      kezdoJatekos = szam;
      document.getElementById("valaszt-1").className = "kezdo-gomb" + (szam === 1 ? " kivalasztva-1" : "");
      document.getElementById("valaszt-2").className = "kezdo-gomb" + (szam === 2 ? " kivalasztva-2" : "");
    }

    function jatekInditasa() {
      if (kezdoJatekos === null) {
        alert("Előbb válasszátok ki, ki kezdje a játékot!");
        return;
      }
      nev1 = document.getElementById("nev1-input").value.trim() || "1. Játékos";
      nev2 = document.getElementById("nev2-input").value.trim() || "2. Játékos";
      document.getElementById("nev1-kijelzo").innerText = nev1;
      document.getElementById("nev2-kijelzo").innerText = nev2;

      document.getElementById("beallitas-panel").style.display = "none";
      document.getElementById("jatek-ter").style.display = "flex";
      teljesUjrainditas();
    }

    function pakliFeltoltese() {
      elerhetoSzamok = [];
      for (let i = 4; i <= 20; i++) elerhetoSzamok.push(i);
    }

    function szivekFrissitese() {
      for (let j = 1; j <= 2; j++) {
        document.getElementById("szivek" + j).innerText = "❤️".repeat(eletek[j]) + "🖤".repeat(3 - eletek[j]);
      }
    }

    function eletVesztes(jatekos) {
      if (jatekVege || eletek[jatekos] <= 0) return;
      eletek[jatekos]--;
      szivekFrissitese();

      if (eletek[jatekos] === 0) {
        jatekVege = true;
        clearInterval(idozito);
        const nyertes = jatekos === 1 ? 2 : 1;
        const nyertesNev = nyertes === 1 ? nev1 : nev2;
        
        document.getElementById("kartya" + nyertes).className = "jatekos-kartya nyertes";
        document.getElementById("kartya" + jatekos).className = "jatekos-kartya vesztes";
        document.getElementById("minusz1").disabled = true;
        document.getElementById("minusz2").disabled = true;
        document.getElementById("gomb").disabled = true;

        const idoDoboz = document.getElementById("ido-doboz");
        idoDoboz.classList.remove("lejart");
        idoDoboz.innerText = "🏆 VÉGE! " + nyertesNev + " nyert!";
        gyozelmiHang();
      }
    }

    function csipogas() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = "sine"; osc.frequency.setValueAtTime(600, ctx.currentTime);
      osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.4);
    }

    function gyozelmiHang() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523.25, 659.25, 783.99, 1046.50].forEach((frek, i) => {
        const osc = ctx.createOscillator();
        osc.type = "triangle"; osc.frequency.setValueAtTime(frek, ctx.currentTime + i * 0.15);
        osc.connect(ctx.destination); osc.start(ctx.currentTime + i * 0.15); osc.stop(ctx.currentTime + i * 0.15 + 0.3);
      });
    }

    function teljesUjrainditas() {
      clearInterval(idozito);
      pakliFeltoltese();
      eletek = { 1: 3, 2: 3 };
      jatekVege = false;
      szivekFrissitese();

      document.getElementById("kartya1").className = "jatekos-kartya" + (kezdoJatekos === 1 ? " aktiv-kartya-1" : "");
      document.getElementById("kartya2").className = "jatekos-kartya" + (kezdoJatekos === 2 ? " aktiv-kartya-2" : "");
      document.getElementById("minusz1").disabled = false;
      document.getElementById("minusz2").disabled = false;
      document.getElementById("gomb").disabled = false;

      const kezdoNev = kezdoJatekos === 1 ? nev1 : nev2;
      document.getElementById("szam").innerText = "?";
      const idoDoboz = document.getElementById("ido-doboz");
      idoDoboz.classList.remove("lejart");
      idoDoboz.innerText = kezdoNev + " kezd! Készen álltok?";
      document.getElementById("hatralevo").innerText = "Mind a 17 szám (4–20 cm) és a 3-3 élet elérhető.";
    }

    function ujKor() {
      if (jatekVege) return;
      if (elerhetoSzamok.length === 0) pakliFeltoltese();

      const idx = Math.floor(Math.random() * elerhetoSzamok.length);
      const szam = elerhetoSzamok.splice(idx, 1);
      document.getElementById("szam").innerText = szam + " cm";
      document.getElementById("hatralevo").innerText = elerhetoSzamok.length === 0 ? "Ez volt az utolsó szám a pakliban!" : "Hátralévő számok ebben a körben: " + elerhetoSzamok.length + " db";
      
      const gomb = document.getElementById("gomb");
      gomb.disabled = true;

      clearInterval(idozito);
      let ido = 10;
      const idoDoboz = document.getElementById("ido-doboz");
      idoDoboz.classList.remove("lejart");
      idoDoboz.innerText = "Hátralévő idő: " + ido + " mp";

      idozito = setInterval(() => {
        ido--;
        if (ido > 0) {
          idoDoboz.innerText = "Hátralévő idő: " + ido + " mp";
        } else {
          clearInterval(idozito);
          idoDoboz.innerText = "IDŐ LEJÁRT! Mérés következik!";
          idoDoboz.classList.add("lejart");
          gomb.disabled = false;
          csipogas();
        }
      }, 1000);
    }
  </script>
</body>
</html>
