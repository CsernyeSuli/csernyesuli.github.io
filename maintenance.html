<!DOCTYPE html>
<html lang="hu" class="bg-slate-950 text-[15px]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rendszer karbantartás</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 bg-fixed font-sans text-slate-100 antialiased p-4">
  <main class="w-full max-w-lg rounded-2xl border border-amber-500/50 bg-slate-900/80 p-6 sm:p-8 text-center shadow-2xl backdrop-blur-md">
    <div class="mb-4 text-5xl">🛠️</div>
    <h1 class="text-2xl font-extrabold tracking-tight text-amber-400 sm:text-3xl">Rendszer karbantartás</h1>
    <p class="mt-3 leading-relaxed text-slate-300">
      A feladatkezelő rendszerünkben jelenleg ütemezett karbantartás vagy frissítés zajlik a stabilabb működés érdekében.
    </p>
    <div class="mt-6 rounded-xl border border-slate-800 bg-slate-950/80 p-4 text-sm text-slate-400">
      Kérlek, próbálkozz újra később! Ha már elvégezted a feladatot, de nem érkezett visszajelzés, ne aggódj, kisvártatva megnyithatod újra az oldalt.
    </div>
    <div class="mt-6">
      <button onclick="location.reload()" class="rounded-xl bg-emerald-400 px-5 py-2.5 font-bold text-slate-900 shadow-[0_0_18px_rgba(52,211,153,0.4)] transition hover:bg-emerald-300 focus:outline-none">
        Frissítés / Újrapróbálás
      </name>
    </div>
  </main>
</body>
</html>
